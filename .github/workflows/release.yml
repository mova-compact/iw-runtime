name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python scripts/check_release.py
      - name: Build reproducible source archive and SBOM
        shell: bash
        run: |
          mkdir release
          git archive --format=tar --prefix=iw-runtime-v3/ "$GITHUB_SHA" | gzip -n > "release/iw-runtime-v3-${GITHUB_REF_NAME}.tar.gz"
          cyclonedx-py requirements requirements.txt --output-format JSON --output-file release/sbom.cdx.json --validate
          cd release
          sha256sum *.tar.gz sbom.cdx.json > SHA256SUMS
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            release/*.tar.gz
            release/sbom.cdx.json
            release/SHA256SUMS
          release-signing-artifacts: false
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
