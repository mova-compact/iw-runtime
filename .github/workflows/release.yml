name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python scripts/check_release.py
      - name: Build reproducible source archive and SBOM
        shell: bash
        run: |
          mkdir release
          git archive --format=tar --prefix=iw-runtime-v3/ "$GITHUB_SHA" | gzip -n > "release/iw-runtime-v3-${GITHUB_REF_NAME}.tar.gz"
          cyclonedx-py requirements requirements.txt --output-format JSON --output-file release/sbom.cdx.json --validate
          cd release
          sha256sum *.tar.gz sbom.cdx.json > SHA256SUMS
      - uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: |
            release/*.tar.gz
            release/sbom.cdx.json
            release/SHA256SUMS
          release-signing-artifacts: false
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
