[project]
name = "intent-workflow-runtime-v3"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["docker: requires a running Docker daemon"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501", "E731", "B011", "B904"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607"]
